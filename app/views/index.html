{% extends "layouts/main.html" %}

{% block pageTitle %}
Home – Remove an overseas entity – GOV.UK Prototype Kit
{% endblock %}

{% block beforeContent %}
  {% include "includes/phase-banner.html" %}
{% endblock %}




{% block content %}
  <div class="govuk-width-container">
  <div class="govuk-grid-row">
  <div class="govuk-grid-column-two-thirds">



<form action="/select-prototype" method="post">

<div class="govuk-form-group">
  <fieldset class="govuk-fieldset">
    <legend class="govuk-fieldset__legend govuk-fieldset__legend--l">
      <h1 class="govuk-fieldset__heading">
        Select ROE prototype
      </h1>
    </legend>
    <div class="govuk-radios govuk-!-padding-top-2" data-module="govuk-radios">
      <div class="govuk-radios__item">
        <input class="govuk-radios__input" id="PrototypeChoice" name="PrototypeChoice" type="radio" value="original">
        <label class="govuk-label govuk-radios__label" for="PrototypeChoice">
          ROE - Original Prototype (Pre-Oct 26)
        </label>
      </div>
      <div class="govuk-radios__item">
        <input class="govuk-radios__input" id="PrototypeChoice-2" name="PrototypeChoice" type="radio" value="Phase3">
        <label class="govuk-label govuk-radios__label" for="PrototypeChoice-2">
     ROE Phase 3 prototype
        </label>
      </div>
     
    </div>
  </fieldset>
</div>


       <button type="submit" class="govuk-button" data-module="govuk-button">
      Continue
</button>

</form>
<br>
    <a href="/manage-prototype" class="govuk-link govuk-body">Manage the prototype</a>


  </div>
</div>





{% endblock %}
